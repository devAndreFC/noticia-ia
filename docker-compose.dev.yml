version: '3.8'

# Docker Compose para desenvolvimento
# Uso: docker-compose -f docker-compose.dev.yml up

services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: newsletter_db_dev
    environment:
      POSTGRES_DB: newsletter_db
      POSTGRES_USER: newsletter_user
      POSTGRES_PASSWORD: newsletter_pass
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - newsletter_network

  # Redis para cache e message broker
  redis:
    image: redis:7-alpine
    container_name: newsletter_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - newsletter_network
    command: redis-server --appendonly yes

  # Backend Django REST Framework (desenvolvimento)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: newsletter_backend_dev
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://newsletter_user:newsletter_pass@db:5432/newsletter_db
      - DB_HOST=db
      - DB_NAME=newsletter_db
      - DB_USER=newsletter_user
      - DB_PASSWORD=newsletter_pass
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - newsletter_network
    command: >
      sh -c "echo 'Aguardando banco de dados...' &&
             while ! nc -z db 5432; do sleep 1; done &&
             echo 'Banco de dados disponível!' &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(is_superuser=True).exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin123')\" &&
             echo 'Iniciando servidor Django...' &&
             python manage.py runserver 0.0.0.0:8000"

  # Frontend React (desenvolvimento)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: newsletter_frontend_dev
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - newsletter_network
    stdin_open: true
    tty: true

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  newsletter_network:
    driver: bridge