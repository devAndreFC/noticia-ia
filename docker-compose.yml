version: '3.8'

services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: newsletter_db
    environment:
      POSTGRES_DB: newsletter_db
      POSTGRES_USER: newsletter_user
      POSTGRES_PASSWORD: newsletter_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - newsletter_network
    restart: unless-stopped

  # Redis para cache e message broker
  redis:
    image: redis:7-alpine
    container_name: newsletter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - newsletter_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Backend Django REST Framework
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsletter_backend
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://newsletter_user:newsletter_pass@db:5432/newsletter_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - newsletter_network
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery Worker para processamento assíncrono
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsletter_celery_worker
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://newsletter_user:newsletter_pass@db:5432/newsletter_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks:
      - newsletter_network
    restart: unless-stopped
    command: celery -A config worker -l info

  # Celery Beat para tarefas agendadas
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsletter_celery_beat
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://newsletter_user:newsletter_pass@db:5432/newsletter_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks:
      - newsletter_network
    restart: unless-stopped
    command: celery -A config beat -l info

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: newsletter_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - newsletter_network
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Flower para monitoramento do Celery
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsletter_flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - newsletter_network
    restart: unless-stopped
    command: celery -A config flower --port=5555

  # Nginx para proxy reverso (produção)
  nginx:
    image: nginx:alpine
    container_name: newsletter_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - backend_media:/var/www/media
    depends_on:
      - backend
      - frontend
    networks:
      - newsletter_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_media:
    driver: local

networks:
  newsletter_network:
    driver: bridge